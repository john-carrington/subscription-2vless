[project]
name = "subscription-2vless"
description ="A utility for downloading VPN subscriptions and extracting supported VPN configurations as links"
keywords = [
    "vpn",
    "vpn-subscription",
    "subscription-extractor",
    "proxy",
    "proxy-links",
    "proxy-parser",
    "proxy-subscription",
    "vpn-links",
    "vpn-parser",
    "vpn-config",
    "link-extractor",
    "link-parser",
    "vless",
    "vmess",
    "v2ray",
    "xray",
    "shadowsocks",
    "shadowsocksr",
    "trojan",
    "hysteria",
    "hysteria2",
    "hy2",
    "tuic",
    "wireguard",
    "socks",
    "socks5",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
version = "1.1.1"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1,<1"
]

[project.urls]
Homepage = "https://github.com/john-carrington/subscription-2vless"
Repository = "https://github.com/john-carrington/subscription-2vless"
Issues = "https://github.com/john-carrington/subscription-2vless/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
subscription-2vless = "subscription_2vless.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["subscription_2vless*"]